# Conda environment for locomotor-transition-development
# Create: conda env create -f environment.yml
# Activate: conda activate analysis-transition

name: analysis-transition
channels:
  - conda-forge
  - defaults
dependencies:
  - python>=3.10,<3.13
  - numpy>=1.22,<2
  - scipy>=1.9
  - matplotlib>=3.5
  - pandas>=1.4
  - h5py>=3.7
  - scikit-image>=0.19
  - scikit-learn>=1.0
  - ipywidgets>=8.0
  - numba>=0.55
  - tqdm>=4.62
  - jupyterlab
  - pip
  - pip:
    - lmfit>=1.0
    - dcor>=0.6
    - matplotlib-scalebar>=0.8
